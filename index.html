<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니게임 천국 - Game Hub</title>
  <style>
    :root {
      --bg-color: #1a1a24;
      --card-bg: #26283b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 960px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 30px rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card-thumbnail {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.08));
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-tag {
      font-size: 12px;
      font-weight: bold;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      flex: 1;
    }

    .play-btn {
      display: inline-block;
      text-align: center;
      padding: 10px 16px;
      background-color: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .play-btn:hover {
      background-color: var(--accent-hover);
    }

    .coming-soon {
      opacity: 0.6;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .coming-soon:hover {
      transform: none;
      box-shadow: none;
      border-color: rgba(255, 255, 255, 0.08);
    }

    .coming-soon .play-btn {
      background-color: #4b5563;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>🕹️ 미니게임 천국 (Mini Games)</h1>
    <p class="subtitle">언제든 가볍게 즐길 수 있는 바닐라 자바스크립트 미니게임 모음</p>
  </header>

  <main class="game-grid">
    <!-- 게임 1: 지뢰찾기 -->
    <article class="game-card">
      <div class="card-thumbnail">💣</div>
      <div class="card-content">
        <span class="card-tag">Game #01</span>
        <h2 class="card-title">지뢰찾기</h2>
        <p class="card-desc">클래식 규칙 완벽 구현! 첫 클릭 안전 보장, 깃발 및 코드(더블클릭) 오픈, 레트로 효과음 지원.</p>
        <a href="games/minesweeper/index.html" class="play-btn">게임 시작하기</a>
      </div>
    </article>

    <!-- 게임 2: 예정 (스네이크) -->
    <article class="game-card coming-soon">
      <div class="card-thumbnail">🐍</div>
      <div class="card-content">
        <span class="card-tag">Game #02</span>
        <h2 class="card-title">스네이크 (준비중)</h2>
        <p class="card-desc">먹이를 먹으며 점점 길어지는 뱀을 조종하세요! 벽과 자신을 피하는 고전 아케이드 게임.</p>
        <span class="play-btn">준비 중</span>
      </div>
    </article>

    <!-- 게임 3: 예정 (2048) -->
    <article class="game-card coming-soon">
      <div class="card-thumbnail">🔢</div>
      <div class="card-content">
        <span class="card-tag">Game #03</span>
        <h2 class="card-title">2048 (준비중)</h2>
        <p class="card-desc">같은 숫자의 타일을 슬라이드하여 합쳐서 2048을 완성하는 두뇌 퍼즐 게임.</p>
        <span class="play-btn">준비 중</span>
      </div>
    </article>
  </main>

</body>
</html>
